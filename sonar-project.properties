sonar.projectKey=trianova-catalog-service
sonar.projectName=Trianova Catalog Service
sonar.sourceEncoding=UTF-8

# Multi-módulo: Sonar descubre los módulos vía el build de Gradle.
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test

# Umbral objetivo de cobertura del dominio y casos de uso: 80%.
